<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Project folder guide</title>
  <desc id="desc">A visual guide showing the important folders and first files to read in the project.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FBFF"/>
      <stop offset="55%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FFF8ED"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 46px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #111827; letter-spacing: .5px; }
      .subtitle { font: 500 22px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #475569; }
      .cardTitle { font: 800 27px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #111827; }
      .label { font: 800 15px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #2563EB; letter-spacing: .4px; }
      .body { font: 500 20px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #334155; }
      .small { font: 500 17px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #64748B; }
      .mono { font: 800 18px "Cascadia Mono", "Consolas", monospace; fill: #1F2937; }
      .monoLight { font: 800 19px "Cascadia Mono", "Consolas", monospace; fill: #E0F2FE; }
      .card { fill: rgba(255,255,255,.93); stroke: #DBEAFE; stroke-width: 1.5; }
      .thin { stroke: #CBD5E1; stroke-width: 1.5; }
      .arrow { stroke: #3B82F6; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 8 12; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="url(#pageBg)"/>
  <circle cx="1190" cy="110" r="230" fill="#DBEAFE" opacity=".5"/>
  <circle cx="118" cy="805" r="250" fill="#FED7AA" opacity=".35"/>
  <path d="M1030 725 C1115 645 1230 675 1310 610" stroke="#BFDBFE" stroke-width="46" opacity=".28" fill="none" stroke-linecap="round"/>

  <text x="72" y="86" class="title">專案資料夾快速導覽</text>
  <text x="74" y="124" class="subtitle">先看根目錄 README，再依照任務進入對應資料夾。</text>

  <g transform="translate(72 166)" filter="url(#softShadow)">
    <rect width="390" height="600" rx="32" class="card"/>
    <text x="34" y="54" class="cardTitle">入口與文件</text>
    <text x="36" y="88" class="small">先從這裡掌握整體流程</text>

    <g transform="translate(34 126)">
      <rect width="322" height="92" rx="24" fill="url(#hero)"/>
      <text x="24" y="38" class="monoLight">README.md</text>
      <text x="24" y="68" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="18" font-weight="700" fill="#DBEAFE">總入口、啟動順序、協作方式</text>
    </g>

    <g transform="translate(34 248)">
      <rect width="322" height="82" rx="22" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="24" y="35" class="mono">docs/</text>
      <text x="24" y="61" class="small">實作步驟 PDF、說明圖片</text>
    </g>

    <g transform="translate(34 360)">
      <rect width="322" height="82" rx="22" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="24" y="35" class="mono">.gitignore</text>
      <text x="24" y="61" class="small">保護 .env、swarm.key、data</text>
    </g>

    <line x1="34" y1="458" x2="356" y2="458" class="thin"/>
    <text x="36" y="496" class="label">建議閱讀順序</text>
    <text x="36" y="528" class="body">1. 根目錄 README.md</text>
    <text x="36" y="560" class="body">2. IPFS 的 README.md</text>
    <text x="36" y="592" class="body">3. 主程式的 README.md</text>
  </g>

  <g transform="translate(510 166)" filter="url(#softShadow)">
    <rect width="390" height="278" rx="32" class="card"/>
    <text x="34" y="54" class="cardTitle">主程式：匿名舉報</text>
    <text x="36" y="91" class="mono">whistleblower-semaphore/</text>
    <text x="36" y="132" class="body">員工身分群組驗證</text>
    <text x="36" y="166" class="body">Semaphore proof 與 nullifier</text>
    <text x="36" y="200" class="body">Admin 讀取鏈上紀錄並解密</text>
    <rect x="34" y="226" width="322" height="34" rx="17" fill="#EFF6FF"/>
    <text x="52" y="249" class="small">先看：README.md、contracts/</text>
  </g>

  <g transform="translate(938 166)" filter="url(#softShadow)">
    <rect width="390" height="278" rx="32" fill="url(#green)" stroke="#BAE6FD" stroke-width="1.5"/>
    <text x="34" y="54" class="cardTitle">私有 IPFS Server</text>
    <text x="36" y="91" class="mono">private-ipfs-cluster/</text>
    <text x="36" y="132" class="body">存放加密後的舉報內容</text>
    <text x="36" y="166" class="body">鏈上只保存 CID 與 hash</text>
    <text x="36" y="200" class="body">Docker 啟動私有 IPFS 節點</text>
    <rect x="34" y="226" width="322" height="34" rx="17" fill="#ECFEFF"/>
    <text x="52" y="249" class="small">先看：README.md、scripts/</text>
  </g>

  <g transform="translate(510 490)" filter="url(#softShadow)">
    <rect width="390" height="210" rx="32" fill="url(#orange)" stroke="#FED7AA" stroke-width="1.5"/>
    <text x="34" y="54" class="cardTitle">舊版 Demo</text>
    <text x="36" y="91" class="mono">legacy-basic-dapp/</text>
    <text x="36" y="132" class="body">早期基本檢舉 DApp</text>
    <text x="36" y="166" class="body">保留參考，不是目前主線</text>
  </g>

  <g transform="translate(938 490)" filter="url(#softShadow)">
    <rect width="390" height="210" rx="32" class="card"/>
    <text x="34" y="54" class="cardTitle">實際啟動順序</text>
    <text x="36" y="96" class="body">1. 開 Docker Desktop</text>
    <text x="36" y="130" class="body">2. 啟動 private IPFS</text>
    <text x="36" y="164" class="body">3. 部署主程式合約</text>
    <text x="36" y="198" class="body">4. 前端檢查 IPFS 與合約</text>
  </g>

  <path class="arrow" d="M462 302 C478 302 492 302 510 302"/>
  <path class="arrow dash" d="M900 302 C914 302 924 302 938 302"/>
  <path class="arrow" d="M705 444 C705 462 705 474 705 490" stroke="#F97316"/>
  <path class="arrow dash" d="M1133 444 C1133 462 1133 474 1133 490"/>

  <g transform="translate(72 804)">
    <rect width="1256" height="54" rx="27" fill="#111827" opacity=".94"/>
    <text x="30" y="35" font-family="Microsoft JhengHei, Noto Sans TC, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">
      一句話：目前主線是 whistleblower-semaphore + private-ipfs-cluster；legacy-basic-dapp 只是舊版參考。
    </text>
  </g>
</svg>
